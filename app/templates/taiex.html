<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加權指數看板</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/charts.css">
</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <h1>加權指數與成交量</h1>
            <div class="subtitle">發行量加權股價指數（收盤）· 集中市場每日成交金額 · 資料來源：臺灣證券交易所</div>
        </div>
        <nav class="topnav">
            <a href="/">訊號儀表板</a>
            <a href="/foreign-futures">外資期貨留倉</a>
        </nav>
    </div>

    <div class="filters" role="group" aria-label="時間範圍">
        <button type="button" data-days="30">1 個月</button>
        <button type="button" data-days="90" aria-pressed="true">3 個月</button>
        <button type="button" data-days="180">6 個月</button>
        <button type="button" data-days="365">1 年</button>
        <button type="button" data-days="0">全部</button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="card">
        <div class="card-head">
            <h2>加權指數（點）</h2>
            <div class="legend">
                <span><i class="key" style="background: var(--series-1)"></i>收盤</span>
                <span><i class="key" style="background: var(--series-2)"></i>MA20</span>
                <span><i class="key" style="background: var(--series-3)"></i>MA60</span>
            </div>
        </div>
        <svg class="chart" id="chart-index" role="img" aria-label="加權指數收盤與 20、60 日均線折線圖"></svg>
        <div class="tooltip" id="tip-index"></div>
    </div>

    <div class="card">
        <div class="card-head">
            <h2>每日成交金額（億元）</h2>
            <div class="legend">
                <span><i class="key box" style="background: var(--series-1)"></i>成交金額</span>
                <span><i class="key" style="background: var(--series-2)"></i>5 日均量</span>
            </div>
        </div>
        <svg class="chart net" id="chart-volume" role="img" aria-label="集中市場每日成交金額長條圖與 5 日均量"></svg>
        <div class="tooltip" id="tip-volume"></div>
    </div>

    <details>
        <summary>資料表</summary>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>日期</th><th>收盤</th><th>漲跌</th><th>漲跌幅</th><th>成交金額(億)</th><th>成交股數(億股)</th><th>成交筆數</th></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </details>

    <div class="footer">每個交易日 14:00 後自動抓取證交所資料</div>
</div>

<script src="/static/charts.js"></script>
<script>
(function () {
    const C = window.MarketCharts;
    const S1 = 'var(--series-1)', S2 = 'var(--series-2)', S3 = 'var(--series-3)';
    const yi = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
    const pct = v => (v > 0 ? '+' : '') + v.toFixed(2) + '%';
    let allRows = [];

    // 均線用完整資料計算，切時間範圍時開頭的均線才不會斷掉
    function withIndicators(source) {
        const rows = source.map(r => {
            const prevClose = r.change != null ? r.close - r.change : null;
            return Object.assign({}, r, {
                turnover_yi: r.turnover != null ? r.turnover / 1e8 : null,
                change_pct: prevClose ? (r.change / prevClose) * 100 : null,
            });
        });
        // 往回 n 筆的平均；不足 n 筆或中間有缺值就回 null（折線會斷開）
        const ma = (i, n, key) => {
            if (i + 1 < n) return null;
            const window = rows.slice(i - n + 1, i + 1).map(r => r[key]);
            return window.some(v => v == null) ? null : window.reduce((a, b) => a + b, 0) / n;
        };
        rows.forEach((r, i) => {
            r.ma20 = ma(i, 20, 'close');
            r.ma60 = ma(i, 60, 'close');
            r.vol_ma5 = ma(i, 5, 'turnover_yi');
        });
        return rows;
    }

    function render(days) {
        const rows = C.filterByDays(allRows, days);
        if (!rows.length) {
            document.getElementById('tiles').textContent = '';
            return C.showEmpty(['chart-index', 'chart-volume'], 'python -m app.services.taiex --backfill 365');
        }
        const last = rows[rows.length - 1];
        const vsMa = ma => ma != null ? `收盤${last.close >= ma ? '高於' : '低於'}均線 ${pct((last.close / ma - 1) * 100)}` : '資料不足';
        C.renderTiles(document.getElementById('tiles'), [
            {
                label: '加權指數', color: S1, value: C.fmt2.format(last.close),
                delta: last.change != null ? `${C.signed(last.change, C.fmt2)} 點（${pct(last.change_pct)}）` : '—',
            },
            {
                label: '成交金額', value: last.turnover_yi != null ? `${yi.format(last.turnover_yi)} 億` : '—',
                delta: last.vol_ma5 ? `5 日均量 ${yi.format(last.vol_ma5)} 億（${pct((last.turnover_yi / last.vol_ma5 - 1) * 100)}）` : '—',
            },
            { label: 'MA20', color: S2, value: last.ma20 != null ? C.fmt2.format(last.ma20) : '—', delta: vsMa(last.ma20) },
            { label: 'MA60', color: S3, value: last.ma60 != null ? C.fmt2.format(last.ma60) : '—', delta: vsMa(last.ma60) },
            { label: '最新交易日', value: last.trade_date, small: true },
        ]);
        C.drawChart(document.getElementById('chart-index'), document.getElementById('tip-index'), rows, [
            { key: 'close', name: '收盤', color: S1 },
            { key: 'ma20', name: 'MA20', color: S2, label: false },
            { key: 'ma60', name: 'MA60', color: S3, label: false },
        ], {
            valueText: v => C.fmt2.format(v),
            axisText: v => C.fmt.format(v),
            labelText: v => C.fmt.format(Math.round(v)),
            extraTip: [{ name: '漲跌', color: 'transparent', value: r => r.change != null ? `${C.signed(r.change, C.fmt2)}（${pct(r.change_pct)}）` : '—' }],
        });
        C.drawChart(document.getElementById('chart-volume'), document.getElementById('tip-volume'), rows, [
            { key: 'turnover_yi', name: '成交金額', color: S1, type: 'bar' },
            { key: 'vol_ma5', name: '5 日均量', color: S2, label: false },
        ], { valueText: v => `${yi.format(v)} 億`, labelText: v => yi.format(v) });
        C.renderTable(document.getElementById('table-body'), rows, r => [
            r.trade_date, C.fmt2.format(r.close),
            r.change != null ? C.signed(r.change, C.fmt2) : '—',
            r.change_pct != null ? pct(r.change_pct) : '—',
            r.turnover_yi != null ? yi.format(r.turnover_yi) : '—',
            r.volume_shares != null ? C.fmt2.format(r.volume_shares / 1e8) : '—',
            r.transactions != null ? C.fmt.format(r.transactions) : '—',
        ]);
    }

    const currentDays = C.bindRange(render, 90);
    fetch('/api/taiex')
        .then(r => r.json())
        .then(data => {
            allRows = withIndicators((data.rows || []).filter(r => r.close != null));
            render(currentDays());
        })
        .catch(err => { console.error(err); render(currentDays()); });
})();
</script>
</body>
</html>
