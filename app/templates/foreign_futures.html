<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外資期貨留倉</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/charts.css">
</head>
<body>
<div class="container">
    <div class="topbar">
        <div>
            <h1>外資期貨留倉</h1>
            <div class="subtitle">外資及陸資 · {{ commodity }} 未平倉口數 · 資料來源：臺灣期貨交易所 三大法人</div>
        </div>
        <nav class="topnav">
            <a href="/">訊號儀表板</a>
            <a href="/taiex">加權指數</a>
            <a href="/options">選擇權</a>
        </nav>
    </div>

    <div class="filters" role="group" aria-label="時間範圍">
        <button type="button" data-days="30">1 個月</button>
        <button type="button" data-days="90" aria-pressed="true">3 個月</button>
        <button type="button" data-days="180">6 個月</button>
        <button type="button" data-days="365">1 年</button>
        <button type="button" data-days="0">全部</button>
    </div>

    <div class="tiles" id="tiles"></div>

    <div class="card">
        <div class="card-head">
            <h2>多單 vs 空單（口）</h2>
            <div class="legend">
                <span><i class="key" style="background: var(--series-1)"></i>多單</span>
                <span><i class="key" style="background: var(--series-2)"></i>空單</span>
            </div>
        </div>
        <svg class="chart" id="chart-oi" role="img" aria-label="外資期貨多單與空單未平倉口數折線圖"></svg>
        <div class="tooltip" id="tip-oi"></div>
    </div>

    <div class="card">
        <div class="card-head">
            <h2>多空淨額（口）</h2>
            <div class="legend"><span>正值 = 淨多單、負值 = 淨空單</span></div>
        </div>
        <svg class="chart net" id="chart-net" role="img" aria-label="外資期貨多空未平倉淨額折線圖"></svg>
        <div class="tooltip" id="tip-net"></div>
    </div>

    <details>
        <summary>資料表</summary>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>日期</th><th>多單</th><th>空單</th><th>淨額</th><th>淨額變化</th></tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </details>

    <div class="footer">每個交易日 15:00 後自動抓取期交所資料</div>
</div>

<script src="/static/charts.js"></script>
<script>
(function () {
    const C = window.MarketCharts;
    const LONG = 'var(--series-1)', SHORT = 'var(--series-2)', NET = 'var(--series-3)';
    let allRows = [];

    function render(days) {
        const rows = C.filterByDays(allRows, days);
        if (!rows.length) {
            document.getElementById('tiles').textContent = '';
            return C.showEmpty(['chart-oi', 'chart-net'], 'python -m app.services.foreign_futures --backfill 365');
        }
        const last = rows[rows.length - 1], prev = rows[rows.length - 2];
        const delta = key => prev ? `較前一日 ${C.signed(last[key] - prev[key])} 口` : '—';
        C.renderTiles(document.getElementById('tiles'), [
            { label: '多單', color: LONG, value: C.fmt.format(last.long_oi), delta: delta('long_oi') },
            { label: '空單', color: SHORT, value: C.fmt.format(last.short_oi), delta: delta('short_oi') },
            { label: '淨額', color: NET, value: C.signed(last.net_oi), delta: delta('net_oi') },
            { label: '最新交易日', value: last.trade_date, small: true },
        ]);
        C.drawChart(document.getElementById('chart-oi'), document.getElementById('tip-oi'), rows, [
            { key: 'long_oi', name: '多單', color: LONG },
            { key: 'short_oi', name: '空單', color: SHORT },
        ], { extraTip: [{ name: '淨額', color: NET, value: r => C.signed(r.net_oi) }] });
        C.drawChart(document.getElementById('chart-net'), document.getElementById('tip-net'), rows, [
            { key: 'net_oi', name: '淨額', color: NET },
        ], { includeZero: true, valueText: v => C.signed(v) });
        C.renderTable(document.getElementById('table-body'), rows, (r, p) => [
            r.trade_date, C.fmt.format(r.long_oi), C.fmt.format(r.short_oi), C.signed(r.net_oi),
            p ? C.signed(r.net_oi - p.net_oi) : '—',
        ]);
    }

    const currentDays = C.bindRange(render, 90);
    fetch('/api/foreign-futures')
        .then(r => r.json())
        .then(data => {
            allRows = (data.rows || []).filter(r => r.long_oi != null && r.short_oi != null && r.net_oi != null);
            render(currentDays());
        })
        .catch(err => { console.error(err); render(currentDays()); });
})();
</script>
</body>
</html>
