version: '3.8'

services:
  nginx:
    image: nginx:stable
    container_name: nginx-tradingsys
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask
    networks:
      - tradingsys_network

  flask:
    build: .
    container_name: flask-tradingsys
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - ./app/data:/app/app/data
    networks:
      - tradingsys_network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tradingsys
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_URL=http://nginx:80
    depends_on:
      - nginx
    networks:
      - tradingsys_network

networks:
  tradingsys_network:
    driver: bridge
